<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · Focus</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="../data.js"></script>
<style>
:root{--bg:#000;--s1:#0F0F0F;--s2:#161616;--line:rgba(255,255,255,.08);--tx:#F2F2F2;--mut:#8F8F8F;--dim:#555;--g:#08C465;--r:#FE3A31}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:400 15px/1.5 Satoshi,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.m{font-family:"JetBrains Mono",monospace;font-feature-settings:"tnum";letter-spacing:-.01em}
.pos{color:var(--g)}.neg{color:var(--r)}
nav.top{height:68px;display:flex;align-items:center;gap:28px;padding:0 40px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:500;font-size:16px;letter-spacing:-.02em}
.logo i{width:26px;height:26px;border-radius:50%;background:var(--g);display:block}
.links{display:flex;gap:26px;margin:0 auto}
.links a{font-size:14px;color:var(--mut);text-decoration:none;height:68px;display:flex;align-items:center}
.links a.on{color:var(--tx);box-shadow:inset 0 -2px 0 var(--tx)}
.acct{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mut)}
.acct b{color:var(--tx);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--g)}
.av{width:34px;height:34px;border-radius:50%;background:#262626;display:grid;place-items:center;font-size:13px}
.wrap{max-width:1120px;margin:0 auto;padding:44px 40px 80px}
.lbl{font-size:14px;color:var(--mut);display:flex;align-items:center;gap:10px}
.sample{font:400 10.5px "JetBrains Mono";color:var(--dim);border:1px dashed rgba(255,255,255,.14);border-radius:6px;padding:1px 6px}
.bal{font:500 68px/1.05 Satoshi;letter-spacing:-.045em;margin-top:10px;font-feature-settings:"tnum"}
.chg{font-size:16px;margin-top:8px}
.chg span{color:var(--mut)}
#chart{height:330px;margin:26px -6px 0}
.rng{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:0}
.rng button{height:42px;padding:0 14px;border:0;background:none;color:var(--mut);font:500 13.5px Satoshi;cursor:pointer}
.rng button.on{color:var(--g);box-shadow:inset 0 -2px 0 var(--g)}
.rng .sp{flex:1}
.rng .btn{align-self:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:40px 0 48px}
.stats div{padding:0 28px;border-left:1px solid var(--line)}
.stats div:first-child{padding-left:0;border-left:0}
.stats small{font-size:13px;color:var(--mut)}
.stats b{display:block;font:500 34px/1.15 Satoshi;letter-spacing:-.03em;margin-top:6px;font-feature-settings:"tnum"}
.stats div>span{font-size:12.5px;color:var(--mut)}
.banner{display:flex;align-items:center;gap:20px;background:var(--s2);border-radius:22px;padding:22px 26px;margin-bottom:48px}
.banner .ic{width:46px;height:46px;border-radius:50%;background:rgba(8,196,101,.14);display:grid;place-items:center;color:var(--g);flex:none}
.banner h3{font-size:17px;font-weight:500}
.banner p{font-size:14px;color:var(--mut)}
.segbar{display:flex;gap:4px;margin-top:10px;width:280px}.segbar i{flex:1;height:4px;border-radius:2px;background:#2a2a2a}.segbar i.on{background:var(--g)}
.btn{height:42px;padding:0 20px;border-radius:999px;border:0;background:var(--tx);color:#000;font:500 14px Satoshi;cursor:pointer;margin-left:auto;white-space:nowrap}
.btn.g{background:var(--s2);color:var(--tx);margin-left:0}
h2{font-size:22px;font-weight:500;letter-spacing:-.02em;margin-bottom:6px}
.sub{font-size:14px;color:var(--mut);margin-bottom:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-bottom:52px}
.ins{display:flex;gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.ins .bar{width:4px;border-radius:2px;flex:none}
.ins b{font-weight:500;font-size:15px;display:block}
.ins p{font-size:13.5px;color:var(--mut)}
.ins .v{margin-left:auto;font-size:14px;white-space:nowrap;padding-top:1px}
.row{display:grid;grid-template-columns:44px 1.1fr 1fr 1fr 120px 20px;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--line);font-size:14.5px}
.row i{width:40px;height:40px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font:500 10px "JetBrains Mono";font-style:normal;color:var(--mut)}
.row .mu{color:var(--mut);font-size:13.5px}
.row .v{text-align:right}
.row svg{width:16px;height:16px;fill:none;stroke:var(--dim);stroke-width:1.7}
</style></head>
<body>
<nav class="top">
  <div class="logo"><i></i>TRADElogs</div>
  <div class="links"><a class="on">Home</a><a>Trades</a><a>Journal</a><a>Analytics</a><a>Calendar</a><a>Markets</a><a>Coach</a></div>
  <div class="acct"><span class="dot"></span><b>XM Global</b><span class="m">·6702</span></div><span class="av">A</span>
</nav>
<div class="wrap">
  <div class="lbl">Account balance <span class="sample">Sample data</span></div>
  <div class="bal" id="bal"></div>
  <div class="chg" id="chg"></div>
  <div id="chart"></div>
  <div class="rng"><button>1W</button><button>1M</button><button class="on">3M</button><button>YTD</button><button>All</button><span class="sp"></span><button class="btn g" style="height:34px">Equity · Drawdown</button></div>

  <div class="stats" id="stats"></div>

  <div class="banner">
    <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h4"/></svg></span>
    <div><h3 id="bh"></h3><p id="bp"></p><div class="segbar" id="segbar"></div></div>
    <button class="btn">Review this week</button>
  </div>

  <div class="two">
    <div><h2>What’s working</h2><p class="sub">Patterns that made you money, from your own trades.</p><div id="good"></div></div>
    <div><h2>What’s costing you</h2><p class="sub">Where the money leaks. Fix one at a time.</p><div id="bad"></div></div>
  </div>

  <h2>Recent trades</h2><p class="sub" id="rsub"></p>
  <div id="rows"></div>
</div>
<script>
const S=SAMPLE,F=fmt,$=id=>document.getElementById(id),G='#08C465',R='#FE3A31';
$('bal').textContent=F.money(S.equityNow);
$('chg').innerHTML=`<b class="m pos" style="font-weight:500">${F.usd(S.net)} (+${F.pct(S.net/S.START)})</b> <span>past 3 months</span>`;
(()=>{const p=S.equity,W=1120,H=330,vs=p.map(x=>x.v),mn=Math.min(...vs),mx=Math.max(...vs);const X=i=>6+i/(p.length-1)*(W-12),Y=v=>H-16-(v-mn)/(mx-mn)*(H-50);
const d=p.map((q,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(q.v).toFixed(1)).join(' ');const hi=p.length-1;
$('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%"><defs><linearGradient id="f" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${G}" stop-opacity=".22"/><stop offset="1" stop-color="${G}" stop-opacity="0"/></linearGradient></defs>
<line x1="0" x2="${W}" y1="${Y(S.START)}" y2="${Y(S.START)}" stroke="rgba(255,255,255,.18)" stroke-dasharray="2 5"/><text x="${W-8}" y="${Y(S.START)-8}" text-anchor="end" style="font-size:11.5px" fill="#666">Start ${F.money(S.START,0)}</text>
<path d="${d} L${X(hi)} ${H} L${X(0)} ${H}Z" fill="url(#f)"/><path d="${d}" fill="none" stroke="${G}" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="${X(hi)}" cy="${Y(p[hi].v)}" r="5" fill="${G}"/><circle cx="${X(hi)}" cy="${Y(p[hi].v)}" r="12" fill="${G}" opacity=".18"/></svg>`})();
const st=[['Win rate',F.pct(S.winRate),`${Math.round(S.winRate*S.n)} of ${S.n} trades`],['Profit factor',S.pf.toFixed(2),'gross win ÷ gross loss'],['Expectancy',`<span class="pos">${F.usd(S.exp,0)}</span>`,'average per trade'],['Max drawdown',`<span class="neg">${F.pct(S.maxDD)}</span>`,'peak to trough']];
$('stats').innerHTML=st.map(([a,b,c])=>`<div><small>${a}</small><b class="m" style="font-family:Satoshi">${b}</b><span>${c}</span></div>`).join('');
const wk=S.trades.filter(t=>t.close>=new Date(2026,9,26));const jn=wk.filter(t=>t.journaled).length;
$('bh').textContent=`${wk.length-jn} trades from this week have no notes`;$('bp').textContent=`Week 44 · ${jn} of ${wk.length} journaled · notes feed your coach review`;
$('segbar').innerHTML=wk.map((t,i)=>`<i class="${i<jn?'on':''}"></i>`).join('');
const sum=a=>a.reduce((x,t)=>x+t.pnl,0);const lw=S.trades.filter(t=>t.side==='Long'),sw=S.trades.filter(t=>t.side==='Short');
const tue=S.days[1],best=[...S.days].sort((a,b)=>b.net-a.net)[0];const worstSym=[...S.bySym].sort((a,b)=>a.net-b.net)[0];
const good=[[`${S.bySym[0].sym} is your best market`,`${F.pct(S.bySym[0].wr,0)} won across ${S.bySym[0].n} trades`,S.bySym[0].net],[`${best.d}s are your strongest day`,`${best.n} trades this period`,best.net],[`Longs carry the edge`,`${lw.length} longs vs ${sw.length} shorts`,sum(lw)]];
const bad=[[`Losers held ${(S.holdLoss/S.holdWin).toFixed(1)}× longer`,`${F.hold(S.holdLoss)} on losers vs ${F.hold(S.holdWin)} on winners`,null],[`Tuesdays bleed`,`${tue.n} trades, the weakest weekday`,tue.net],[`One trade wiped out ${Math.round(-S.worst/S.avgWin*10)/10} average wins`,`Your largest loss this period`,S.worst]];
const ins=(a,c)=>a.map(([t,p,v])=>`<div class="ins"><span class="bar" style="background:${c}"></span><div><b>${t}</b><p>${p}</p></div>${v!=null?`<span class="v m ${v>=0?'pos':'neg'}">${F.usd(v,0)}</span>`:''}</div>`).join('');
$('good').innerHTML=ins(good,G);$('bad').innerHTML=ins(bad,R);
$('rsub').textContent=`${S.n} closed in the last 3 months`;
$('rows').innerHTML=S.trades.slice(-6).reverse().map(t=>`<div class="row"><i>${t.sym.slice(0,3)}</i><b style="font-weight:500">${t.sym}</b><span class="mu">${t.side} · ${F.hold(t.hold)}</span><span class="mu">${F.time(t.close)}</span><span class="v m ${t.pnl>0?'pos':'neg'}">${F.usd(t.pnl)}</span><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></div>`).join('');
</script>
</body></html>
