<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0A">
<title>Offline · TRADElogs</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0A0A0A; color: #EDEDED; font: 15px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
  main { max-width: 360px; padding: 24px; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 14px; }
  h1 { font-size: 20px; font-weight: 600; margin: 18px 0 8px; }
  p { color: #9A9A9A; margin: 0 0 20px; }
  button { background: #EDEDED; color: #0A0A0A; border: 0; border-radius: 999px; padding: 10px 20px; font: inherit; font-weight: 500; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>You’re offline</h1>
  <p>TRADElogs needs a connection to show your trades and live prices. It will pick up where you left off.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
